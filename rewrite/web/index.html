<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4e8c8" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (() => {
        let appearance;
        try {
          appearance = localStorage.getItem("melodytrack.rewrite.appearance");
        } catch {
          // An unavailable preference store does not block the system theme.
        }
        if (appearance !== "light" && appearance !== "dark") {
          appearance = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.appearance = appearance;
        document.documentElement.style.colorScheme = appearance;
        const background = appearance === "dark" ? "#15120f" : "#f4e8c8";
        document.documentElement.style.backgroundColor = background;
        document.querySelector('meta[name="theme-color"]').content = background;
      })();
    </script>
    <meta name="description" content="Рабочее пространство музыкальной школы MelodyTrack" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>MelodyTrack — музыкальная школа</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

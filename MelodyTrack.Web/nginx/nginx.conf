server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/security-headers.inc;

    etag on;

    brotli on;
    brotli_comp_level 6;
    brotli_min_length 1024;
    brotli_types
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml
        text/css
        text/plain
        text/xml;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml
        text/css
        text/plain
        text/xml;

    location = /index.html {
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "no-cache" always;
    }

    location ~* ^/(?:sw|service-worker)\.js$ {
        try_files $uri =404;
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "no-cache" always;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    location ~* \.(?:ico|png|svg|webmanifest)$ {
        try_files $uri =404;
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

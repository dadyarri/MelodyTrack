name: MelodyTrack CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
      - design/melodytrack-v2

permissions:
  contents: read

concurrency:
  group: monorepo-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  backend-verify:
    name: backend verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rewrite
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: rewrite/global.json
      - name: Restore dependencies
        run: dotnet restore MelodyTrack.Rewrite.slnx
      - name: Build rewrite solution
        run: dotnet build MelodyTrack.Rewrite.slnx --no-restore -c Release
      - name: Run backend tests
        run: dotnet test --solution MelodyTrack.Rewrite.slnx --no-build -c Release

  frontend-checks:
    name: frontend static checks, unit tests and bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rewrite/web
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: rewrite/web/.node-version
          cache: npm
          cache-dependency-path: rewrite/web/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev
      - name: Check formatting and types, run Vitest and build
        run: npm run verify

  frontend-browser:
    name: frontend browser tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    defaults:
      run:
        working-directory: rewrite/web
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: rewrite/web/.node-version
          cache: npm
          cache-dependency-path: rewrite/web/package-lock.json
      - name: Run Playwright projects in Docker
        run: npm run test:browser -- --project '${{ matrix.browser }}*'

  frontend-verify:
    name: frontend verify
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs:
      - frontend-checks
      - frontend-browser
    steps:
      - name: Require frontend verification lanes
        env:
          CHECKS_RESULT: ${{ needs.frontend-checks.result }}
          BROWSER_RESULT: ${{ needs.frontend-browser.result }}
        run: test "$CHECKS_RESULT" = success && test "$BROWSER_RESULT" = success

  contract-build-verify:
    name: contract/build verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rewrite/web
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up .NET and the Kiota runtime
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
          global-json-file: rewrite/global.json
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: rewrite/web/.node-version
          cache: npm
          cache-dependency-path: rewrite/web/package-lock.json
      - name: Regenerate the rewrite API client from OpenAPI
        run: npm run api:generate
      - name: Reject stale generated files
        run: |
          changes=$(git status --porcelain --untracked-files=all -- src/shared/api/generated)
          if [ -n "$changes" ]; then
            echo "$changes"
            exit 1
          fi

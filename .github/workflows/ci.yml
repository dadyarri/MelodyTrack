name: MelodyTrack CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

env:
  VITE_API_BASE_URL: /api

concurrency:
  group: monorepo-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  release-metadata:
    name: release metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      release_kind: ${{ steps.release-kind.outputs.kind }}
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: "10.0.x"
      - name: Validate release changelog
        run: dotnet run scripts/ReleaseTool.cs -- validate
      - name: Test release allocation and merge-back rules
        run: dotnet run scripts/ReleaseTool.cs -- self-test
      - name: Read release version
        id: release
        run: echo "version=$(dotnet run scripts/ReleaseTool.cs -- current-version)" >> "$GITHUB_OUTPUT"
      - name: Determine release merge kind
        id: release-kind
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF" = "refs/heads/master" ]; then
            kind=$(dotnet run scripts/ReleaseTool.cs -- release-kind)
          else
            kind=none
          fi
          echo "kind=$kind" >> "$GITHUB_OUTPUT"

  backend-compile:
    name: backend compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: |
            global.json
            MelodyTrack.slnx
            MelodyTrack.Backend/*.csproj
            MelodyTrack.Backend.Tests/*.csproj
      - name: Setup Node.js 26
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: MelodyTrack.Web/package-lock.json
      - name: Restore dependencies
        run: dotnet restore MelodyTrack.slnx
      - name: Build
        run: dotnet build MelodyTrack.slnx --no-restore -c Release
      - name: Upload compiled test module
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-tests-release
          path: MelodyTrack.Backend.Tests/bin/Release/net10.0
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  backend-test:
    name: backend test (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: backend-compile
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: unit
            arguments: "-trait- Category=Integration"
          - name: integration-a-m
            arguments: >-
              -trait Category=Integration
              -class MelodyTrack.Backend.Tests.A* -class MelodyTrack.Backend.Tests.B*
              -class MelodyTrack.Backend.Tests.C* -class MelodyTrack.Backend.Tests.D*
              -class MelodyTrack.Backend.Tests.E* -class MelodyTrack.Backend.Tests.F*
              -class MelodyTrack.Backend.Tests.G* -class MelodyTrack.Backend.Tests.H*
              -class MelodyTrack.Backend.Tests.I* -class MelodyTrack.Backend.Tests.J*
              -class MelodyTrack.Backend.Tests.K* -class MelodyTrack.Backend.Tests.L*
              -class MelodyTrack.Backend.Tests.M*
          - name: integration-n-z
            arguments: >-
              -trait Category=Integration
              -class MelodyTrack.Backend.Tests.N* -class MelodyTrack.Backend.Tests.O*
              -class MelodyTrack.Backend.Tests.P* -class MelodyTrack.Backend.Tests.Q*
              -class MelodyTrack.Backend.Tests.R* -class MelodyTrack.Backend.Tests.S*
              -class MelodyTrack.Backend.Tests.T* -class MelodyTrack.Backend.Tests.U*
              -class MelodyTrack.Backend.Tests.V* -class MelodyTrack.Backend.Tests.W*
              -class MelodyTrack.Backend.Tests.X* -class MelodyTrack.Backend.Tests.Y*
              -class MelodyTrack.Backend.Tests.Z*
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: "10.0.x"
      - name: Download compiled test module
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: backend-tests-release
          path: MelodyTrack.Backend.Tests/bin/Release/net10.0
      - name: Run tests
        run: |
          chmod +x MelodyTrack.Backend.Tests/bin/Release/net10.0/MelodyTrack.Backend.Tests
          read -ra test_arguments <<< '${{ matrix.arguments }}'
          MelodyTrack.Backend.Tests/bin/Release/net10.0/MelodyTrack.Backend.Tests "${test_arguments[@]}"

  backend-verify:
    name: backend verify
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs:
      - release-metadata
      - backend-compile
      - backend-test
    steps:
      - name: Require backend verification lanes
        env:
          RELEASE_METADATA_RESULT: ${{ needs.release-metadata.result }}
          COMPILE_RESULT: ${{ needs.backend-compile.result }}
          TEST_RESULT: ${{ needs.backend-test.result }}
        run: |
          for result in "$RELEASE_METADATA_RESULT" "$COMPILE_RESULT" "$TEST_RESULT"; do
            if [ "$result" != "success" ]; then
              exit 1
            fi
          done

  frontend-static:
    name: frontend static and security checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: MelodyTrack.Web
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Setup Node.js 26
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: MelodyTrack.Web/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev
      - name: Verify static analysis, security, and types
        run: npm run verify:static

  frontend-unit:
    name: frontend unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: MelodyTrack.Web
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Setup Node.js 26
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: MelodyTrack.Web/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Run unit tests
        run: npm run verify:unit

  frontend-chromium:
    name: frontend Chromium tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: MelodyTrack.Web
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Setup Node.js 26
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: MelodyTrack.Web/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Run Chromium tests
        run: npm run verify:chromium

  frontend-bundle:
    name: frontend production bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: MelodyTrack.Web
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Setup Node.js 26
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: MelodyTrack.Web/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Build and check bundle budget
        run: npm run verify:bundle

  frontend-webkit:
    name: frontend WebKit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: MelodyTrack.Web
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Setup Node.js 26
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: MelodyTrack.Web/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Cache WebKit browser
        id: webkit-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-webkit-${{ hashFiles('MelodyTrack.Web/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-webkit-
      - name: Install WebKit system dependencies
        run: npx playwright install-deps webkit
      - name: Install WebKit browser
        if: steps.webkit-cache.outputs.cache-hit != 'true'
        run: npx playwright install webkit
      - name: Verify WebKit behavior
        run: npm run test:webkit

  frontend-verify:
    name: frontend verify
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs:
      - frontend-static
      - frontend-unit
      - frontend-chromium
      - frontend-bundle
      - frontend-webkit
    steps:
      - name: Require frontend verification lanes
        env:
          STATIC_RESULT: ${{ needs.frontend-static.result }}
          UNIT_RESULT: ${{ needs.frontend-unit.result }}
          CHROMIUM_RESULT: ${{ needs.frontend-chromium.result }}
          BUNDLE_RESULT: ${{ needs.frontend-bundle.result }}
          WEBKIT_RESULT: ${{ needs.frontend-webkit.result }}
        run: |
          for result in "$STATIC_RESULT" "$UNIT_RESULT" "$CHROMIUM_RESULT" "$BUNDLE_RESULT" "$WEBKIT_RESULT"; do
            if [ "$result" != "success" ]; then
              exit 1
            fi
          done

  contract-build-verify:
    name: contract/build verify
    runs-on: ubuntu-latest
    needs:
      - backend-verify
      - frontend-verify
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: |
            global.json
            dotnet-tools.json
            Directory.Packages.props
            MelodyTrack.slnx
      - name: Setup Node.js 26
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: MelodyTrack.Web/package-lock.json
      - name: Restore dependencies
        run: dotnet restore MelodyTrack.slnx
      - name: Regenerate API contract and client
        run: dotnet build MelodyTrack.slnx --no-restore -c Release
      - name: Reject stale generated client
        run: git diff --exit-code -- MelodyTrack.Web/src/shared/api/generated

  image-integration:
    name: unified image integration
    runs-on: ubuntu-latest
    needs:
      - backend-verify
      - frontend-verify
      - contract-build-verify
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Build unified image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: MelodyTrack.Backend/Dockerfile
          load: true
          tags: melodytrack:integration
          cache-from: type=gha,scope=application
          cache-to: type=gha,mode=max,scope=application
          build-args: |
            RELEASE_VERSION=integration
            VITE_API_BASE_URL=${{ env.VITE_API_BASE_URL }}
      - name: Verify unified image over HTTP
        run: scripts/verify-unified-image.sh melodytrack:integration

  image-package:
    name: image/package
    runs-on: ubuntu-latest
    needs:
      - release-metadata
      - backend-verify
      - frontend-verify
      - contract-build-verify
      - image-integration
    permissions:
      contents: write
      packages: write
      pull-requests: read
    steps:
      - name: Record pull request package placeholder
        if: github.ref != 'refs/heads/master' || needs.release-metadata.outputs.release_kind == 'none'
        run: echo "Production image publication runs only for a validated release or hotfix merge to master."
      - name: Checkout code
        if: github.ref == 'refs/heads/master' && needs.release-metadata.outputs.release_kind != 'none'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Setup .NET
        if: github.ref == 'refs/heads/master' && needs.release-metadata.outputs.release_kind != 'none'
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: "10.0.x"
      - name: Set up Docker Buildx
        if: github.ref == 'refs/heads/master' && needs.release-metadata.outputs.release_kind != 'none'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Login to GitHub Container Registry
        if: github.ref == 'refs/heads/master' && needs.release-metadata.outputs.release_kind != 'none'
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push MelodyTrack image
        if: github.ref == 'refs/heads/master' && needs.release-metadata.outputs.release_kind != 'none'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: MelodyTrack.Backend/Dockerfile
          push: true
          cache-from: type=gha,scope=application
          cache-to: type=gha,mode=max,scope=application
          build-args: |
            RELEASE_VERSION=${{ needs.release-metadata.outputs.version }}
            VITE_API_BASE_URL=${{ env.VITE_API_BASE_URL }}
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/melody-track:latest
            ghcr.io/${{ github.repository_owner }}/melody-track:${{ needs.release-metadata.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/melody-track:sha-${{ github.sha }}
      - name: Publish release tag and notes
        if: github.ref == 'refs/heads/master' && needs.release-metadata.outputs.release_kind != 'none'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet run scripts/ReleaseTool.cs -- publish

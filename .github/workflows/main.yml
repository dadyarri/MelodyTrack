on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: |
            global.json
            MelodyTrack.slnx
            MelodyTrack.Backend/*.csproj
            MelodyTrack.Backend.Tests/*.csproj
      - name: Validate release changelog
        run: dotnet run scripts/ReleaseTool.cs -- validate
      - name: Restore dependencies
        run: dotnet restore MelodyTrack.slnx
      - name: Build
        run: dotnet build MelodyTrack.slnx --no-restore -c Release
      - name: Run tests
        run: dotnet test MelodyTrack.slnx --no-build --no-restore -c Release --verbosity normal

  push-to-docker:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: write
      packages: write
      pull-requests: read
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Read release version
        id: release
        run: echo "version=$(dotnet run scripts/ReleaseTool.cs -- current-version)" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: MelodyTrack.Backend/Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: RELEASE_VERSION=${{ steps.release.outputs.version }}
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/melody-track-backend:latest
            ghcr.io/${{ github.repository_owner }}/melody-track-backend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/melody-track-backend:${{ steps.release.outputs.version }}
      - name: Publish release tag and notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet run scripts/ReleaseTool.cs -- publish
